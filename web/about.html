<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About OneSource Solutions</title>
    <style>
        :root {
            --ink: #20252b;
            --muted: #66717b;
            --blue: #83cdf7;
            --orange: #e85c18;
            --line: #dce3e8;
            --paper: #f5f7f8;
            --white: #fff;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            line-height: 1.65;
        }

        a { color: inherit; }
        .site-header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--blue);
            box-shadow: 0 5px 20px rgba(20, 33, 43, 0.13);
        }

        .header-inner {
            width: min(1160px, calc(100% - 40px));
            min-height: 76px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
        }

        .brand img { width: 42px; height: 42px; object-fit: contain; }
        .header-links { display: flex; gap: 24px; font-weight: 600; text-decoration: none; }
        .header-links a { text-decoration: none; }
        .header-links a:hover { text-decoration: underline; text-underline-offset: 5px; }

        .about-banner { padding: 56px 20px; background: var(--blue); }
        .about-banner-inner { width: min(1080px, 100%); margin: 0 auto; }
        .about-banner span { color: #23536e; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
        .about-banner h1 { max-width: 760px; margin: 8px 0 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; }
        .content { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 88px; }
        .eyebrow { color: var(--orange); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
        .content h2 { margin: 8px 0 20px; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.15; }
        .description { white-space: pre-line; color: #48535c; font-size: 1.08rem; }
        .uploaded-gallery-section { margin-top: 44px; }
        .uploaded-gallery-section h3 { margin: 0 0 16px; font-size: 1.35rem; }
        .uploaded-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }
        .uploaded-gallery figure { margin: 0; aspect-ratio: 4 / 3; overflow: hidden; background: #e2e8ec; }
        .uploaded-gallery img { width: 100%; height: 100%; object-fit: cover; }
        .admin-panel {
            margin-top: 48px;
            padding: 24px;
            border-top: 3px solid var(--blue);
            background: white;
        }

        .admin-panel h2 { margin-top: 0; font-size: 1.4rem; }
        .admin-note { color: var(--muted); font-size: 0.9rem; }
        .editor-label { display: block; margin: 18px 0 8px; font-weight: 700; }
        textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            resize: vertical;
            border: 1px solid #b8c2ca;
            border-radius: 4px;
            color: var(--ink);
            font: inherit;
        }

        input[type="file"] { max-width: 100%; margin: 8px 0 16px; }
        .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .button {
            min-height: 42px;
            padding: 9px 16px;
            border: 0;
            border-radius: 4px;
            color: white;
            background: var(--orange);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .button.secondary { color: var(--ink); background: #e7edf1; }
        .button:disabled { opacity: 0.6; cursor: wait; }
        .status { min-height: 1.5em; margin: 12px 0 0; color: #147341; }
        .status.error { color: #b42318; }
        .image-admin-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
        .image-admin-item { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #e7edf1; }
        .image-admin-item img { width: 100%; height: 100%; object-fit: cover; }
        .remove-image {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 50%;
            color: white;
            background: #b42318;
            font-size: 1.1rem;
            cursor: pointer;
        }

        footer { padding: 22px 20px; color: #dce3e8; background: #20252b; text-align: center; font-size: 0.9rem; }

        @media (max-width: 600px) {
            .header-inner { width: calc(100% - 28px); min-height: 68px; }
            .brand { font-size: 0.95rem; }
            .brand img { width: 36px; height: 36px; }
            .header-links { gap: 12px; font-size: 0.9rem; }
            .about-banner { padding: 40px 18px; }
            .content { width: calc(100% - 36px); padding: 48px 0 64px; }
            .admin-panel { padding: 18px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="index.html">
                <img src="./logo.png" alt="">
                <span>OneSource Solutions</span>
            </a>
            <nav class="header-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="index.html#solutions">Solutions</a>
                <a href="index.html#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="about-banner">
            <div class="about-banner-inner">
                <span>About OneSource</span>
                <h1 id="about-heading"></h1>
            </div>
        </section>

        <section class="content">
            <span class="eyebrow">Who we are</span>
            <h2>Practical ICT solutions, built around your business</h2>
            <p class="description" id="about-description"></p>
            <p class="status error" id="about-load-error" role="status" hidden></p>
            <section class="uploaded-gallery-section" id="uploaded-gallery-section" aria-label="About photos" hidden>
                <h3>About photos</h3>
                <div class="uploaded-gallery" id="uploaded-gallery"></div>
            </section>
            <div id="editor-root"></div>
        </section>
    </main>

    <footer>OneSource Solutions Limited · ICT Solutions for Business Growth</footer>

    <script>
        (() => {
            const defaultHeading = 'Technology that helps businesses move forward';
            const defaultDescription = 'OneSource Solutions Limited is a Nairobi-based ICT partner helping businesses work smarter through dependable technology. We bring together business hardware, tax-compliant systems, software, networking, and security solutions, with practical guidance from selection through implementation and ongoing support.\n\nOur team works with organizations across retail, hospitality, healthcare, and other sectors to match the right technology to the way each business operates.';
            const isLocalPreview = window.location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(window.location.hostname);
            const API_BASE = window.ONESOURCE_API_BASE || (isLocalPreview ? 'http://localhost:5055/api' : 'https://onesource-api.onrender.com/api');
            const API_ROOT = API_BASE.replace(/\/api$/, '');
            const headingElement = document.getElementById('about-heading');
            const descriptionElement = document.getElementById('about-description');
            const uploadedGallerySection = document.getElementById('uploaded-gallery-section');
            const uploadedGallery = document.getElementById('uploaded-gallery');
            const editorRoot = document.getElementById('editor-root');
            let content = { heading: defaultHeading, description: defaultDescription, images: [] };
            let pendingFiles = [];

            function isAdmin() {
                return localStorage.getItem('authRole') === 'Admin' && !!localStorage.getItem('authToken');
            }

            function imageSource(imageUrl) {
                return /^https?:\/\//i.test(imageUrl) ? imageUrl : `${API_ROOT}${imageUrl}`;
            }

            function applyContent(data) {
                content = {
                    heading: data.heading || defaultHeading,
                    description: data.description || defaultDescription,
                    images: Array.isArray(data.images) ? data.images.map(image => ({
                        aboutImageId: image.aboutImageId,
                        src: imageSource(image.imageUrl),
                        alt: 'About OneSource image'
                    })) : []
                };
            }

            async function apiRequest(path, options = {}) {
                const token = localStorage.getItem('authToken');
                const headers = { ...options.headers };
                if (token) headers.Authorization = `Bearer ${token}`;
                const response = await fetch(`${API_BASE}${path}`, { ...options, headers });
                if (!response.ok) {
                    const message = await response.text();
                    throw new Error(message || `Request failed (${response.status})`);
                }
                return response;
            }

            async function loadContent() {
                const loadError = document.getElementById('about-load-error');
                try {
                    const response = await apiRequest('/About');
                    applyContent(await response.json());
                    loadError.hidden = true;
                } catch (error) {
                    loadError.textContent = 'About content could not be loaded from the server. Please try again later.';
                    loadError.hidden = false;
                    console.error('Could not load About content.', error);
                }
                renderDescription();
                renderUploadedGallery();
                renderEditor();
            }

            function renderUploadedGallery() {
                uploadedGallery.replaceChildren();
                uploadedGallerySection.hidden = content.images.length === 0;
                content.images.forEach(image => {
                    const figure = document.createElement('figure');
                    const preview = document.createElement('img');
                    preview.src = image.src;
                    preview.alt = image.alt || 'About OneSource image';
                    figure.append(preview);
                    uploadedGallery.append(figure);
                });
            }

            function showStatus(message, isError = false) {
                const status = document.getElementById('about-status');
                if (!status) return;
                status.textContent = message;
                status.classList.toggle('error', isError);
            }

            function renderDescription() {
                headingElement.textContent = content.heading || defaultHeading;
                descriptionElement.textContent = content.description || defaultDescription;
            }

            function renderEditor() {
                editorRoot.replaceChildren();
                if (!isAdmin()) return;

                const panel = document.createElement('section');
                panel.className = 'admin-panel';
                panel.innerHTML = `
                    <h2>Edit About page</h2>
                    <p class="admin-note">Description and image changes are published to the About page for all visitors.</p>
                    <label class="editor-label" for="about-heading-editor">About heading</label>
                    <input id="about-heading-editor" type="text" maxlength="250">
                    <label class="editor-label" for="about-editor">About description</label>
                    <textarea id="about-editor" maxlength="5000"></textarea>
                    <label class="editor-label" for="about-images">Upload images</label>
                    <input id="about-images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
                    <div class="image-admin-list" aria-label="Current About images"></div>
                    <div class="actions">
                        <button type="button" class="button" id="save-description">Save heading and description</button>
                        <button type="button" class="button" id="upload-about-images" disabled>Upload selected images</button>
                        <button type="button" class="button secondary" id="cancel-about">Discard text edits</button>
                    </div>
                    <p class="status" id="about-status" role="status"></p>
                `;
                editorRoot.append(panel);
                panel.querySelector('#about-heading-editor').value = content.heading || defaultHeading;
                panel.querySelector('#about-editor').value = content.description || defaultDescription;
                panel.querySelector('#about-images').addEventListener('change', event => {
                    pendingFiles = Array.from(event.target.files || []);
                    panel.querySelector('#upload-about-images').disabled = pendingFiles.length === 0;
                    showStatus(`${pendingFiles.length} image(s) selected.`);
                });
                panel.querySelector('#save-description').addEventListener('click', saveDescription);
                panel.querySelector('#upload-about-images').addEventListener('click', uploadImages);
                panel.querySelector('#cancel-about').addEventListener('click', () => {
                    panel.querySelector('#about-editor').value = content.description || defaultDescription;
                    pendingFiles = [];
                    panel.querySelector('#about-images').value = '';
                    panel.querySelector('#upload-about-images').disabled = true;
                    showStatus('Unsaved text edits discarded.');
                });
                renderImageManager(panel);
            }

            function renderImageManager(panel) {
                const list = panel.querySelector('.image-admin-list');
                list.replaceChildren();
                content.images.forEach((image, index) => {
                    const item = document.createElement('div');
                    item.className = 'image-admin-item';
                    const preview = document.createElement('img');
                    preview.src = image.src;
                    preview.alt = image.alt || 'About image';
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'remove-image';
                    remove.textContent = '×';
                    remove.setAttribute('aria-label', `Remove image ${index + 1}`);
                    remove.addEventListener('click', () => deleteImage(image.aboutImageId));
                    item.append(preview, remove);
                    list.append(item);
                });
            }

            async function saveDescription() {
                if (!isAdmin()) return;
                const saveButton = document.getElementById('save-description');
                saveButton.disabled = true;
                showStatus('Saving About content...');
                try {
                    const heading = document.getElementById('about-heading-editor').value.trim();
                    const description = document.getElementById('about-editor').value.trim();
                    const response = await apiRequest('/About', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ heading, description })
                    });
                    applyContent(await response.json());
                    renderDescription();
                    renderEditor();
                    showStatus('About content saved.');
                } catch (error) {
                    showStatus(error.message || 'Could not save the description.', true);
                    saveButton.disabled = false;
                }
            }

            async function uploadImages() {
                if (!isAdmin() || pendingFiles.length === 0) return;
                const uploadButton = document.getElementById('upload-about-images');
                uploadButton.disabled = true;
                showStatus('Uploading images...');
                try {
                    const formData = new FormData();
                    pendingFiles.forEach(file => formData.append('files', file));
                    const response = await apiRequest('/About/images', { method: 'POST', body: formData });
                    applyContent(await response.json());
                    pendingFiles = [];
                    renderUploadedGallery();
                    renderEditor();
                    showStatus('Images uploaded.');
                } catch (error) {
                    showStatus(error.message || 'Could not upload the selected images.', true);
                    uploadButton.disabled = false;
                }
            }

            async function deleteImage(imageId) {
                if (!isAdmin() || !window.confirm('Remove this image from the About page?')) return;
                showStatus('Removing image...');
                try {
                    await apiRequest(`/About/images/${imageId}`, { method: 'DELETE' });
                    await loadContent();
                    showStatus('Image removed.');
                } catch (error) {
                    showStatus(error.message || 'Could not remove the image.', true);
                }
            }

            renderDescription();
            renderEditor();
            loadContent();
        })();
    </script>
</body>
</html>
