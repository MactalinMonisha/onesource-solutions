                                                        title="Delete this image"
                                                        disabled={deletingImageId === currentImageId}
                                                        onClick={() => deleteProductImage(productId, currentImageId)}
                                                        style={{
                                                            position: 'absolute',
                                                            top: '6px',
                                                            left: '6px',
                                                            width: '22px',
                                                            height: '22px',
                                                            lineHeight: '20px',
                                                            borderRadius: '50%',
                                                            border: 'none',
                                                            cursor: deletingImageId === currentImageId ? 'not-allowed' : 'pointer',
                                                            background: '#dc2626',
                                                            color: 'white',
                                                            fontSize: '0.75rem',
                                                            fontWeight: 700,
                                                            padding: 0,
                                                            opacity: deletingImageId === currentImageId ? 0.6 : 1
                                                        }}
                                                    >
                                                        {deletingImageId === currentImageId ? '…' : '🗑'}
                                                    </button>
                                                    )}
                                                </div>
                                            ) : (
                                                <div style={{background: '#1e40af', color: 'white', fontSize: '3rem', padding: '2rem', textAlign: 'center'}}>
                                                    📦
                                                </div>
                                            )}
                                            <div className="product-body">
                                                <h3>{productName}</h3>
                                                {productDescription && <p>{productDescription}</p>}
                                                {isAdmin && (
                                                <label style={{ display: 'block', fontSize: '0.75rem', color: '#475569', marginBottom: '0.5rem', cursor: 'pointer' }}>
                                                    {uploadingImagesForId === productId ? 'Uploading...' : '📤 Upload image(s)'}
                                                    <input
                                                        type="file"
                                                        accept="image/*"
                                                        multiple
                                                        disabled={uploadingImagesForId === productId}
                                                        onChange={(event) => {
                                                            uploadProductImages(productId, event.target.files);
                                                            event.target.value = '';
                                                        }}
                                                        style={{ display: 'none' }}
                                                    />
                                                </label>
                                                )}
                                                <button
                                                    className="enquire-btn"
                                                    onClick={() => sendWhatsAppMessage(productName)}
                                                >
                                                    Enquire Now
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    <section id="offers" className="section">
                        <div className="container">
                            <h2 className="section-title">Current Offers</h2>

                            {isAdmin && (
                            <div className="category-form" style={{marginBottom: '1.5rem'}}>
                                <button
                                    type="button"
                                    className="enquire-btn"
                                    onClick={() => {
                                        setShowOfferForm((isVisible) => !isVisible);
                                        setOfferMessage(null);
                                    }}
                                >
                                    {showOfferForm ? 'Close Offer Form' : '+ Add Offer'}
                                </button>

                                {showOfferForm && (
                                    <form onSubmit={addOffer} style={{marginTop: '1rem'}}>
                                        <div className="category-form-fields">
                                            <label>
                                                Offer name
                                                <input
                                                    type="text"
                                                    value={newOfferName}
                                                    onChange={(event) => setNewOfferName(event.target.value)}
                                                    placeholder="e.g. 10% Offer"
                                                    required
                                                />
                                            </label>
                                            <label>
                                                Description
                                                <input
                                                    type="text"
                                                    value={newOfferDescription}
                                                    onChange={(event) => setNewOfferDescription(event.target.value)}
                                                    placeholder="e.g. Purchase with product code HRKDNS908"
                                                />
                                            </label>
                                            <button type="submit" className="enquire-btn" disabled={offerSubmitting}>
                                                {offerSubmitting ? 'Adding...' : 'Save Offer'}
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {offerMessage && (
                                    <p className={`category-form-message ${offerMessage.type}`} role="status">
                                        {offerMessage.text}
                                    </p>
                                )}
                            </div>
                            )}

                            {offersLoading ? (
                                <p>Loading offers...</p>
                            ) : offers.length === 0 ? (
                                <p>No current offers. Check back soon!</p>
                            ) : (
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: '1rem', marginTop: '2rem'}}>
                                {offers.map((offer) => (
                                    <div key={offer.offerId} style={{background: 'white', border: '1px solid #e2e8f0', borderRadius: '10px', padding: '1.2rem', boxShadow: '0 2px 8px rgba(0,0,0,0.05)'}}>
                                        {editingOfferId === offer.offerId ? (
                                            <div style={{display: 'flex', flexDirection: 'column', gap: '0.5rem'}}>
                                                <input
                                                    type="text"
                                                    value={editingOfferName}
                                                    onChange={(event) => setEditingOfferName(event.target.value)}
                                                    placeholder="Offer name"
                                                />
                                                <input
                                                    type="text"
                                                    value={editingOfferDescription}
                                                    onChange={(event) => setEditingOfferDescription(event.target.value)}
                                                    placeholder="Description"
                                                />
                                                <div style={{display: 'flex', gap: '0.4rem'}}>
                                                    <button type="button" className="enquire-btn" onClick={() => saveEditOffer(offer.offerId)} disabled={offerSubmitting}>Save</button>
                                                    <button type="button" onClick={() => setEditingOfferId(null)}>Cancel</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <>
                                                <div style={{display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '0.6rem'}}>
                                                    <h3 style={{color: '#ea580c', margin: 0, fontSize: '1.1rem'}}>🎁 {offer.offerName}</h3>
                                                    {isAdmin && (
                                                        <span style={{display: 'flex', gap: '0.4rem', flexShrink: 0}}>
                                                            <button type="button" onClick={() => startEditOffer(offer)} title="Edit">✏️</button>
                                                            <button
                                                                type="button"
                                                                onClick={() => deleteOffer(offer.offerId, offer.offerName)}
                                                                disabled={deletingOfferId === offer.offerId}
                                                                title="Delete"
                                                            >
                                                                {deletingOfferId === offer.offerId ? '...' : '🗑️'}
                                                            </button>
                                                        </span>
                                                    )}
                                                </div>
                                                {offer.description && (
                                                    <p style={{marginTop: '0.5rem', color: '#475569', fontSize: '0.9rem'}}>{offer.description}</p>
                                                )}
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                            )}
                        </div>
                    </section>

                    <section className="section">
                        <div className="container">
                            <h2 className="section-title">Trusted by Leading Companies</h2>

                            {isAdmin && (
                            <div className="category-form" style={{marginBottom: '1.5rem'}}>
                                <button
                                    type="button"
                                    className="enquire-btn"
                                    onClick={() => {
                                        setShowTrustedCompanyForm((isVisible) => !isVisible);
                                        setTrustedCompanyMessage(null);
                                    }}
                                >
                                    {showTrustedCompanyForm ? 'Close Company Form' : '+ Add Trusted Company'}
                                </button>

                                {showTrustedCompanyForm && (
                                    <form onSubmit={addTrustedCompany} style={{marginTop: '1rem'}}>
                                        <div className="category-form-fields">
                                            <label>
                                                Company name
                                                <input
                                                    type="text"
                                                    value={newTrustedCompanyName}
                                                    onChange={(event) => setNewTrustedCompanyName(event.target.value)}
                                                    placeholder="e.g. Acme Corporation"
                                                    required
                                                />
                                            </label>
                                            <button type="submit" className="enquire-btn" disabled={trustedCompanySubmitting}>
                                                {trustedCompanySubmitting ? 'Adding...' : 'Save Company'}
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {trustedCompanyMessage && (
                                    <p className={`category-form-message ${trustedCompanyMessage.type}`} role="status">
                                        {trustedCompanyMessage.text}
                                    </p>
                                )}
                            </div>
                            )}

                            {trustedCompaniesLoading ? (
                                <p>Loading trusted companies...</p>
                            ) : (
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '1rem', marginTop: '2rem'}}>
                                {trustedCompanies.map((client) => (
                                    <div key={client.trustedCompanyId} style={{background: 'white', border: '1px solid #e2e8f0', borderRadius: '10px', padding: '1rem 1.2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '0.6rem', boxShadow: '0 2px 8px rgba(0,0,0,0.05)', fontWeight: 600, color: '#1e40af', fontSize: '0.9rem'}}>
                                        {editingTrustedCompanyId === client.trustedCompanyId ? (
                                            <div style={{display: 'flex', gap: '0.4rem', width: '100%'}}>
                                                <input
                                                    type="text"
                                                    value={editingTrustedCompanyName}
                                                    onChange={(event) => setEditingTrustedCompanyName(event.target.value)}
                                                    style={{flex: 1, minWidth: 0}}
                                                />
                                                <button type="button" className="enquire-btn" onClick={() => saveEditTrustedCompany(client.trustedCompanyId)} disabled={trustedCompanySubmitting}>Save</button>
                                                <button type="button" onClick={() => setEditingTrustedCompanyId(null)}>Cancel</button>
                                            </div>
                                        ) : (
                                            <>
                                                <span style={{display: 'flex', alignItems: 'center', gap: '0.6rem'}}>
                                                    <span style={{color: '#ea580c', fontWeight: 800}}>✓</span>
                                                    {client.companyName}
                                                </span>
                                                {isAdmin && (
                                                    <span style={{display: 'flex', gap: '0.4rem'}}>
                                                        <button type="button" onClick={() => startEditTrustedCompany(client)} title="Edit">✏️</button>
                                                        <button
                                                            type="button"
                                                            onClick={() => deleteTrustedCompany(client.trustedCompanyId, client.companyName)}
                                                            disabled={deletingTrustedCompanyId === client.trustedCompanyId}
                                                            title="Remove"
                                                        >
                                                            {deletingTrustedCompanyId === client.trustedCompanyId ? '...' : '🗑️'}
                                                        </button>
                                                    </span>
                                                )}
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                            )}
                        </div>
                    </section>

                    <section id="contact" className="container">
                        <div className="contact-section">
                            <h2>Get In Touch With Us</h2>
                            <p>Whether you're purchasing for personal use or your business, we're here to help you choose the right products and solutions.</p>

                            {isAdmin && (
                            <div className="category-form" style={{marginBottom: '1.5rem'}}>
                                <button
                                    type="button"
                                    className="enquire-btn"
                                    onClick={() => {
                                        setShowContactForm((isVisible) => !isVisible);
                                        setContactMessage(null);
                                    }}
                                >
                                    {showContactForm ? 'Close Contact Form' : '✏️ Edit Contact Details'}
                                </button>

                                {showContactForm && (
                                    <form onSubmit={updateContact} style={{marginTop: '1rem'}}>
                                        <div className="category-form-fields">
                                            <label>
                                                Phone
                                                <input type="text" value={contactPhone} onChange={(event) => setContactPhone(event.target.value)} placeholder="+254207903190" />
                                            </label>
                                            <label>
                                                WhatsApp number
                                                <input type="text" value={contactWhatsApp} onChange={(event) => setContactWhatsApp(event.target.value)} placeholder="+254735610610" />
                                            </label>
                                            <label>
                                                Email
                                                <input type="email" value={contactEmail} onChange={(event) => setContactEmail(event.target.value)} placeholder="info@onesourcesolutionske.com" />
                                            </label>
                                            <label>
                                                Location
                                                <input type="text" value={contactLocation} onChange={(event) => setContactLocation(event.target.value)} placeholder="Office address" />
                                            </label>
                                            <label>
                                                Website
                                                <input type="text" value={contactWebsite} onChange={(event) => setContactWebsite(event.target.value)} placeholder="https://www.onesourcesolutionske.com" />
                                            </label>
                                            <button type="submit" className="enquire-btn" disabled={contactSubmitting}>
                                                {contactSubmitting ? 'Saving...' : 'Save Contact Details'}
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {contactMessage && (
                                    <p className={`category-form-message ${contactMessage.type}`} role="status">
                                        {contactMessage.text}
                                    </p>
                                )}
                            </div>
                            )}

                            {contactLoading ? (
                                <p>Loading contact details...</p>
                            ) : (
                            <div className="contact-info">
                                <a href={`mailto:${contact?.email || 'info@onesourcesolutionske.com'}`} className="contact-card">
                                    <strong>📧 Email</strong>
                                    <span>{contact?.email || 'info@onesourcesolutionske.com'}</span>
                                </a>

                                <a href={`https://wa.me/${(contact?.whatsApp || '+254735610610').replace(/[^0-9]/g, '')}`} target="_blank" rel="noreferrer" className="contact-card">
                                    <strong>📱 WhatsApp</strong>
                                    <span>{contact?.whatsApp || '+254 735 610610'}</span>
                                </a>

                                <a href={`tel:${contact?.phone || '+254207903190'}`} className="contact-card">
                                    <strong>☎️ Phone</strong>
                                    <span>{contact?.phone || '020 7903190'}</span>
                                </a>

                                <a href={`https://maps.google.com/?q=${encodeURIComponent(contact?.location || 'Nairobi, Kenya')}`} target="_blank" rel="noreferrer" className="contact-card">
                                    <strong>📍 Location</strong>
                                    <span>{contact?.location || 'Nairobi, Kenya'}</span>
                                </a>

                                <div className="contact-card">
                                    <strong>📮 Postal Address</strong>
                                    <span>P.O. Box 221 – 00623, Nairobi, Kenya</span>
                                </div>

                                <a href={contact?.website || 'https://www.onesourcesolutionske.com'} target="_blank" rel="noreferrer" className="contact-card">
                                    <strong>🌐 Website</strong>
                                    <span>{contact?.website || 'www.onesourcesolutionske.com'}</span>
                                </a>
                            </div>
                            )}
                        </div>
                    </section>

                    <footer>
                        <p>&copy; 2025 OneSource Solutions Limited. All rights reserved.</p>
                        <p style={{marginTop: '1rem', fontSize: '0.9rem'}}>
                            <a href={`mailto:${contact?.email || 'info@onesourcesolutionske.com'}`}>Contact</a>
                            <a href={`https://wa.me/${(contact?.whatsApp || '+254735610610').replace(/[^0-9]/g, '')}`}>WhatsApp</a>
                            <a href={`tel:${contact?.phone || '+254207903190'}`}>Phone</a>
                        </p>
                        <p style={{marginTop: '1rem', fontSize: '0.8rem', opacity: 0.7}}>
                            ICT Solutions for Business Growth • KRA Licensed • 24/7 Support
                        </p>
                    </footer>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SalesPage />);
    </script>
</body>
</html>
