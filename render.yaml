services:
  - type: web
    name: onesource-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: onesource-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: OneSourceApi
      - key: Jwt__Audience
        value: OneSourceClient
      - key: ALLOWED_ORIGINS
        value: "null,https://mactalinmonisha.github.io"

databases:
  - name: onesource-db
    plan: free
    databaseName: onesource_db
    user: onesource_user
